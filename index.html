    <style>
        /* ═══════════════════════════════════════════════════════════════════════════
           CSS CUSTOM PROPERTIES - Design System Variables
           ═══════════════════════════════════════════════════════════════════════════ */
        :root {
            /* Dark Romantic Color Palette */
            --color-black: #0a0508;
            --color-deep-black: #1a0a10;
            --color-burgundy: #6b1530;
            --color-crimson: #8b1538;
            --color-wine: #722f37;
            --color-rose-gold: #b76e79;
            --color-soft-pink: #e8b4bc;
            --color-blush: #f5d5dc;
            --color-cream: #fff5f7;
            --color-gold: #d4af37;
            --color-warm-white: #fdf8f5;
            
            /* Gradients */
            --gradient-romantic: linear-gradient(135deg, var(--color-burgundy) 0%, var(--color-crimson) 50%, var(--color-wine) 100%);
            --gradient-soft: linear-gradient(180deg, var(--color-deep-black) 0%, #2a1018 50%, var(--color-burgundy) 100%);
            --gradient-glow: radial-gradient(ellipse at center, var(--color-crimson) 0%, transparent 70%);
            
            /* Typography Scale */
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'Cormorant Garamond', Georgia, serif;
            --font-script: 'Dancing Script', cursive;
            --font-ui: 'Inter', -apple-system, sans-serif;
            
            /* Spacing */
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 2rem;
            --space-xl: 4rem;
            --space-2xl: 8rem;
            
            /* Animation Timings */
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out-expo: cubic-bezier(0.87, 0, 0.13, 1);
            --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            
            /* Glassmorphism */
            --glass-bg: rgba(139, 21, 56, 0.1);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: 20px;
            
            /* Shadows */
            --shadow-soft: 0 4px 30px rgba(139, 21, 56, 0.3);
            --shadow-glow: 0 0 60px rgba(183, 110, 121, 0.4);
            --shadow-deep: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* ═══════════════════════════════════════════════════════════════════════════
           RESET & BASE STYLES
           ═══════════════════════════════════════════════════════════════════════════ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            font-family: var(--font-body);
            font-size: 18px;
            line-height: 1.8;
            color: var(--color-cream);
            background: var(--color-deep-black);
            overflow-x: hidden;
            min-height: 100vh;
            transition: background 2s ease;
        }
        
        /* Accessibility: Focus styles */
        :focus-visible {
            outline: 2px solid var(--color-rose-gold);
            outline-offset: 4px;
        }
        
        /* Skip link for accessibility */
        .skip-link {
            position: absolute;
            top: -100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-burgundy);
            color: var(--color-cream);
            padding: var(--space-sm) var(--space-md);
            border-radius: 0 0 8px 8px;
            z-index: 10000;
            transition: top 0.3s ease;
        }
        
        .skip-link:focus {
            top: 0;
        }
        
        /* Selection styling */
        ::selection {
            background: var(--color-rose-gold);
            color: var(--color-deep-black);
        }

        /* ═══════════════════════════════════════════════════════════════════════════
           LOADING SCREEN - Premium Entry Animation
           ═══════════════════════════════════════════════════════════════════════════ */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 1.5s var(--ease-out-expo), visibility 1.5s;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        /* Animated heart loader */
        .loader-heart {
            width: 80px;
            height: 80px;
            position: relative;
            animation: pulse-heart 1.2s ease-in-out infinite;
        }
        
        .loader-heart::before,
        .loader-heart::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 65px;
            background: var(--gradient-romantic);
            border-radius: 40px 40px 0 0;
        }
        
        .loader-heart::before {
            left: 40px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        
        .loader-heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        
        @keyframes pulse-heart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        
        .loading-text {
            margin-top: var(--space-lg);
            font-family: var(--font-script);
            font-size: 1.5rem;
            color: var(--color-rose-gold);
            opacity: 0.8;
            animation: fade-pulse 2s ease-in-out infinite;
        }
        
        @keyframes fade-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .loading-progress {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: var(--space-lg);
            overflow: hidden;
        }
        
        .loading-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gradient-romantic);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* ═══════════════════════════════════════════════════════════════════════════
           ANIMATED BACKGROUND - Multi-layer Visual Effects
           ═══════════════════════════════════════════════════════════════════════════ */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        /* Animated gradient background */
        .gradient-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(139, 21, 56, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(107, 21, 48, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(183, 110, 121, 0.1) 0%, transparent 60%);
            animation: gradient-shift 20s ease-in-out infinite;
            will-change: transform;
        }
        
        @keyframes gradient-shift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 5%) rotate(2deg); }
            50% { transform: translate(-5%, 10%) rotate(-2deg); }
            75% { transform: translate(-10%, 5%) rotate(1deg); }
        }
        
        /* Stars container */
        .stars-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .star {
            position: absolute;
            background: var(--color-cream);
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration, 3s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
            cursor: pointer;
            pointer-events: auto;
        }
        
        .star.touched {
            animation: star-burst 0.6s ease-out forwards;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }
        
        @keyframes star-burst {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(3); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        
        /* Floating particles */
        .particles-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            animation: float-particle var(--duration, 15s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
            will-change: transform, opacity;
        }
        
        @keyframes float-particle {
            0%, 100% { 
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            25% { 
                transform: translate(50px, -100px) scale(1.2);
                opacity: 0.6;
            }
            50% { 
                transform: translate(-30px, -200px) scale(0.8);
                opacity: 0.4;
            }
            75% { 
                transform: translate(80px, -150px) scale(1.1);
                opacity: 0.5;
            }
        }
        
        /* Floating hearts */
        .hearts-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .floating-heart {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0;
            animation: float-up var(--duration, 10s) ease-out infinite;
            animation-delay: var(--delay, 0s);
            will-change: transform, opacity;
        }
        
        @keyframes float-up {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-20vh) translateX(var(--drift, 50px)) rotate(360deg) scale(1);
                opacity: 0;
            }
        }
        
        /* Rose petals */
        .petals-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .petal {
            position: absolute;
            width: 15px;
            height: 20px;
            background: var(--gradient-romantic);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            opacity: 0;
            animation: fall-petal var(--duration, 12s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
            will-change: transform, opacity;
        }
        
        @keyframes fall-petal {
            0% {
                transform: translateY(-5vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(105vh) translateX(var(--drift, 100px)) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* Sparkles */
        .sparkles-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--color-gold);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            opacity: 0;
            animation: sparkle-pop var(--duration, 2s) ease-out infinite;
            animation-delay: var(--delay, 0s);
        }
        
        @keyframes sparkle-pop {
            0%, 100% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: scale(1) rotate(180deg);
                opacity: 1;
            }
        }
        
        /* Fireflies (night mode) */
        .fireflies-container {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease;
        }
        
        .fireflies-container.active {
            opacity: 1;
        }
        
        .firefly {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffff88;
            border-radius: 50%;
            box-shadow: 0 0 10px 3px rgba(255, 255, 136, 0.8);
            animation: firefly-float var(--duration, 8s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }
        
        @keyframes firefly-float {
            0%, 100% {
                transform: translate(0, 0);
                opacity: 0.2;
            }
            25% {
                transform: translate(var(--x1, 30px), var(--y1, -50px));
                opacity: 1;
            }
            50% {
                transform: translate(var(--x2, -20px), var(--y2, 40px));
                opacity: 0.3;
            }
            75% {
                transform: translate(var(--x3, 50px), var(--y3, 20px));
                opacity: 0.9;
            }
        }
        
        /* Rain effect */
        .rain-container {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
        }
        
        .rain-container.active {
            opacity: 1;
        }
        
        .raindrop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, transparent, rgba(183, 110, 121, 0.6));
            animation: rain-fall var(--duration, 1s) linear infinite;
            animation-delay: var(--delay, 0s);
        }
        
        @keyframes rain-fall {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0.5;
            }
        }
        
        /* Cursor glow effect */
        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(183, 110, 121, 0.15) 0%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: opacity 0.3s ease;
            will-change: transform;
        }

        /* ═══════════════════════════════════════════════════════════════════════════
           ENVELOPE ANIMATION - Opening Sequence
           ═══════════════════════════════════════════════════════════════════════════ */
        .envelope-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background: var(--color-black);
            transition: opacity 1s var(--ease-out-expo), visibility 1s;
        }
        
        .envelope-scene.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .envelope-wrapper {
            perspective: 1000px;
            cursor: pointer;
        }
        
        .envelope {
            position: relative;
            width: min(400px, 90vw);
            height: min(280px, 60vw);
            transform-style: preserve-3d;
        }
        
        /* Envelope body */
        .envelope-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f5e6d3 0%, #e8d4c0 100%);
            border-radius: 8px;
